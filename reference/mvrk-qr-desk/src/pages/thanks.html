<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} — {{TITLE}}</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1220; color:#f1f5f9; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:24px; box-sizing:border-box; text-align:center; }
  .brand { font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:#94a3b8; margin-bottom:28px; }
  .icon { width:88px; height:88px; border-radius:50%; margin:0 auto 22px; display:grid; place-items:center; }
  .ok .icon { background:#22c55e; } .warn .icon { background:#f59e0b; } .bad .icon { background:#f87171; }
  h1 { font-size:28px; margin:0 0 10px; }
  p { color:#cbd5e1; font-size:17px; margin:0; line-height:1.5; }
  .amount { margin-top:16px; font-size:22px; font-weight:700; }
</style>
</head>
<body class="{{TONE}}">
  <div>
    <div class="brand">{{BRAND}}</div>
    <div class="icon"><span style="font-size:46px;font-weight:800;color:#0b1220;line-height:1">{{ICON}}</span></div>
    <h1>{{TITLE}}</h1>
    <p>{{MESSAGE}}</p>
    <div class="amount">{{AMOUNT}}</div>
  </div>
</body>
</html>
