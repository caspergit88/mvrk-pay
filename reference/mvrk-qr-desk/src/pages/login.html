<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} — Sign in</title>
<style>
  :root { --bg:#0b1220; --card:#121b2e; --text:#e6edf7; --muted:#8b9bb4; --accent:#2dd4bf; --danger:#f87171; --line:#223050; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:16px; }
  form { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  h1 { font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; font-weight:600; }
  h2 { margin:0 0 22px; font-size:24px; font-weight:600; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; font-size:18px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#0e1627; color:var(--text); }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { margin-top:22px; width:100%; font-size:18px; font-weight:600; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#06281f; cursor:pointer; }
  .err { color:var(--danger); font-size:14px; margin-top:12px; min-height:1.2em; }
</style>
</head>
<body>
  <form method="post" action="/login" autocomplete="on">
    <h1>{{APP_NAME}}</h1>
    <h2>Staff sign in</h2>
    <label for="u">Username</label>
    <input id="u" name="username" autocapitalize="none" autocorrect="off" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err">{{ERROR}}</div>
  </form>
</body>
</html>
